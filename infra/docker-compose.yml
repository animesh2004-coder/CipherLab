version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cipherlab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cipherlab
      POSTGRES_USER: cipherlab_dev
      POSTGRES_PASSWORD: cipherlab_dev_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cipherlab_dev -d cipherlab"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cipherlab-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
